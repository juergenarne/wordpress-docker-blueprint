services:
  web:
    image: ${APP_NAME}-web:php${PHP_VERSION}
    build:
      context: .
      args:
        PHP_VERSION: ${PHP_VERSION}
    restart: always
    container_name: ${APP_NAME}-apache
    volumes:
      - ${APACHE_HTDOCS}:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/php.ini
      - ./msmtprc:/etc/msmtprc:ro
    ports:
      - "${BIND_ADDRESS}:${APACHE_PORT}:80"
    networks:
      - develop-network
    depends_on:
      - db
      - redis
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_APP_NAME: ${APP_NAME}
      WORDPRESS_REDIS_HOST: redis
      WORDPRESS_REDIS_PORT: 6379
      WORDPRESS_URL: ${WORDPRESS_URL}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT}

  db:
    image: mariadb:${MARIADB_VERSION}
    restart: always
    container_name: ${APP_NAME}-mariadb
    environment:
          MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
          MYSQL_DATABASE: ${MYSQL_DATABASE}
          MYSQL_USER: ${MYSQL_USER}
          MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${MARIADB_LOCAL_DIR}${MARIADB_DATA_DIR}:/var/lib/mysql
      - ${MARIADB_LOCAL_DIR}${MARIADB_CONF_DIR}:/etc/mysql/conf.d
      - ${MARIADB_LOCAL_DIR}${MARIADB_ETC_DIR}:/etc/mysql
    ports:
      - "${BIND_ADDRESS}:${MYSQL_PORT}:3306"
    networks:
      - develop-network

  redis:
    image: redis:7
    restart: always
    container_name: ${APP_NAME}-redis
    networks:
      - develop-network

networks:
  develop-network:
    driver: bridge

volumes:
  db_data:
